version: '3.8'

services:
  screenshot:
    build: .
    container_name: screenshot-service
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - CORS=true
      - ENABLE_DEMO=true
      - HEADLESS=true
      - TIMEOUT=30000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
